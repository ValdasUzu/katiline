<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Katilinė</title>
<meta name="description" content="Katilinės būsena ir nustatymai per MQTT">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Katilinė">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--tx:#f9fafb;--mu:#9ca3af;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:960px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.c h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}.r:last-child{border:0}
.v{font-weight:600;text-align:right}.mu{color:var(--mu);font-size:12px}.g{margin-top:10px}
.st{font-size:13px;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap;background:var(--mu)}
.st.on{background:var(--ok)}.st.warn{background:var(--warn)}.st.off{background:var(--bad)}
input,select{width:96px;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:15px}
button{padding:8px 12px;border:0;border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;font-size:14px}
button.sec{background:transparent;color:var(--ac);padding:6px 4px}
button:disabled{opacity:.5}
.wide{grid-column:1/-1}#msg{min-height:18px;margin-top:6px}
#set .r>span:last-child{white-space:nowrap;flex-shrink:0}
@media(max-width:420px){#set input,#set select{width:72px}}
#login{max-width:420px;margin:24px auto;padding:0 12px}
#login label{display:block;margin:12px 0 4px}
#login input:not([type=checkbox]){width:100%}
.hide{display:none!important}
</style>
</head>
<body>
<header><h1 id="ttl">Katilinė</h1><span><span id="lnk" class="st">…</span> <button id="out" class="sec hide" title="Atsijungti">Atsijungti</button></span></header>

<div id="login" class="hide">
  <div class="c">
    <h2>Prisijungimas</h2>
    <form id="lf">
      <label>Brokeris</label><input id="l_host" required placeholder="xxxx.ala.eu-central-1.emqxsl.com" autocomplete="off" autocapitalize="off">
      <label>Įrenginys</label><input id="l_dev" required placeholder="katiline-xxxx" autocomplete="off" autocapitalize="off">
      <label>Vartotojas</label><input id="l_user" required autocomplete="username" autocapitalize="off">
      <label>Slaptažodis</label><input id="l_pass" type="password" required autocomplete="current-password">
      <details class="g"><summary class="mu">Daugiau</summary>
        <label>Temų pradžia</label><input id="l_prefix" value="katiline" autocapitalize="off">
        <label>Prievadas (WebSocket TLS)</label><input id="l_port" type="number" value="8084">
      </details>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="l_rem" checked style="width:auto">Prisiminti šiame telefone</label>
      <p><button>Prisijungti</button></p>
      <div id="lmsg" class="mu"></div>
    </form>
  </div>
</div>

<main id="app" class="hide">
  <div class="c"><h2>Lauke ir šaltinis</h2><div id="g0"></div></div>
  <div class="c"><h2>Kambariai</h2><div id="g1"></div></div>
  <div class="c"><h2>Boileris</h2><div id="g2"></div><p><button id="hn">Šildyti dabar (Heat Now)</button></p></div>
  <div class="c wide"><h2>Nustatymai</h2><div id="set" class="mu">laukiama katilinės…</div><div id="msg" class="mu"></div></div>
  <div class="c wide"><h2>Ryšys</h2><div id="dev"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="app.js"></script>
</body>
</html>
